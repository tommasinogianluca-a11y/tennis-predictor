{% extends "base.html" %}
{% block title %}Predict — Scommettitore{% endblock %}

{% block content %}
<h1 class="text-white font-bold text-lg mb-5">🔮 Predict Match</h1>

<div class="bg-[#1a1a2e] rounded-lg p-5 max-w-md">
  <form
    hx-post="/app/predict"
    hx-target="#predict-result"
    hx-swap="innerHTML"
    hx-indicator="#predict-spinner"
  >
    <div class="grid grid-cols-2 gap-3 mb-3">

      <!-- Player 1 autocomplete -->
      <div x-data="playerSearch()" class="relative">
        <label class="block text-gray-400 text-xs mb-1">Player 1</label>
        <input type="hidden" name="player1_id" :value="selectedId" required>
        <input
          type="text"
          autocomplete="off"
          placeholder="Cerca nome..."
          x-model="query"
          @input.debounce.300ms="search"
          @focus="open = true"
          @blur="closeDelayed"
          @keydown.escape="close"
          :class="selectedId ? 'border-purple-600' : 'border-[#2a2a3e]'"
          class="w-full bg-[#0f0f1a] border rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-600"
        >
        <div x-show="open" x-cloak x-ref="dropdown" class="relative z-10"></div>
      </div>

      <!-- Player 2 autocomplete -->
      <div x-data="playerSearch()" class="relative">
        <label class="block text-gray-400 text-xs mb-1">Player 2</label>
        <input type="hidden" name="player2_id" :value="selectedId" required>
        <input
          type="text"
          autocomplete="off"
          placeholder="Cerca nome..."
          x-model="query"
          @input.debounce.300ms="search"
          @focus="open = true"
          @blur="closeDelayed"
          @keydown.escape="close"
          :class="selectedId ? 'border-purple-600' : 'border-[#2a2a3e]'"
          class="w-full bg-[#0f0f1a] border rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-600"
        >
        <div x-show="open" x-cloak x-ref="dropdown" class="relative z-10"></div>
      </div>

    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="block text-gray-400 text-xs mb-1">Superficie</label>
        <select name="surface"
          class="w-full bg-[#0f0f1a] border border-[#2a2a3e] rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-600">
          {% for s in surfaces %}
          <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-gray-400 text-xs mb-1">Categoria</label>
        <select name="category"
          class="w-full bg-[#0f0f1a] border border-[#2a2a3e] rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-purple-600">
          {% for c in categories %}
          <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <button type="submit"
      class="w-full bg-purple-600 hover:bg-purple-700 text-white rounded py-2 text-sm font-medium transition-colors">
      Calcola Predizione
    </button>

    <div id="predict-spinner" class="htmx-indicator text-center mt-3 text-gray-500 text-sm">
      ⏳ Calcolando...
    </div>
  </form>
</div>

<div id="predict-result" class="mt-4 max-w-md"></div>

<script>
function playerSearch() {
  return {
    query: '',
    selectedId: null,
    open: false,

    async search() {
      this.selectedId = null;
      if (this.query.length < 2) {
        this.open = false;
        this.$refs.dropdown.innerHTML = '';
        return;
      }
      const resp = await fetch('/app/players/autocomplete?q=' + encodeURIComponent(this.query));
      const html = await resp.text();
      this.$refs.dropdown.innerHTML = html;
      this.open = html.trim().length > 0;
      // Wire up click handlers on rendered items
      this.$refs.dropdown.querySelectorAll('li[data-id]').forEach(li => {
        li.addEventListener('mousedown', (e) => {
          e.preventDefault();
          this.selectedId = li.dataset.id;
          this.query = li.dataset.name;
          this.open = false;
          this.$refs.dropdown.innerHTML = '';
        });
      });
    },

    close() {
      this.open = false;
    },

    closeDelayed() {
      setTimeout(() => { this.open = false; }, 150);
    },
  };
}
</script>

<style>
  [x-cloak] { display: none !important; }
  .htmx-indicator { display: none; }
  .htmx-indicator.htmx-request { display: block !important; }
</style>
{% endblock %}
